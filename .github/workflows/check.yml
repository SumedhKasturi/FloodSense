name: Flood risk check and phone push

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:
    inputs:
      zip:
        description: "Check only this ZIP (blank: every registered ZIP)"
        required: false
        default: ""
      force_level:
        description: "Send a test push (marked TEST) at this level without touching the stored state; requires zip"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - elevated
          - high

permissions:
  contents: read

# Never run two checks at once, so one rise cannot be pushed twice.
concurrency:
  group: flood-risk-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check registered ZIPs and push on a rise
        # Inputs reach the shell as environment variables, never pasted into the script.
        # --zip is passed only when set; force_level requires zip (the check exits 1 otherwise),
        # so a test push never reaches every subscriber.
        run: python -m alerts.check ${ZIP:+--zip "$ZIP"} ${FORCE_LEVEL:+--force-level "$FORCE_LEVEL"}
        env:
          ZIP: ${{ github.event.inputs.zip }}
          FORCE_LEVEL: ${{ github.event.inputs.force_level }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC_SECRET: ${{ secrets.NTFY_TOPIC_SECRET }}
          NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
          APP_URL: ${{ secrets.APP_URL }}
